[workspace]
members = [".", "gui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["TheBeaninator"]
repository = "https://github.com/TheBeaninator/linkbench"
readme = "README.md"

[package]
name = "linkbench"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme.workspace = true
description = "Single-pane benchmark of the link between two compute nodes, in ML-relevant terms"
keywords = ["benchmark", "rdma", "roce", "network", "ml"]
categories = ["command-line-utilities", "science"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
libloading = "0.8"

[profile.release]
lto = true
codegen-units = 1
